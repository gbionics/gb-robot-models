[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gb-robot-models"
version = "0.1.0"
description = "Public robot models from Generative Bionics"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
dependencies = [
	"resolve-robotics-uri-py",
]

[project.scripts]
gb-robot-models = "gb_robot_models.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
